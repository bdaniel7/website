---
layout: default
title: Mate
---

{{ with .Site.GetPage "section" "mate" }}
  <h2>Contents of {{ .Title }}</h2>
  <ul>
    {{ range .Pages }}
      <li>
        <a href="{{ .Permalink }}">{{ .Title }}</a>
        {{ if .IsSection }} (Folder) {{ else }} (Page) {{ end }}
      </li>
    {{ end }}
  </ul>
{{ end }}
